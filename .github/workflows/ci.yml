name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff check .
      - name: Compile
        run: python -m py_compile bin/kosha kosha/*.py
      - name: ShellCheck
        run: shellcheck -S warning install.sh
      - name: Version and changelog agree
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' kosha/__init__.py)
          grep -q "^## v$v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$v"; exit 1; }
      - name: Unit tests (and the registry is valid)
        run: python -m unittest discover -s tests -v
      - name: Install a package end to end
        run: |
          export HOME=$(mktemp -d)
          bin/kosha install bhava
          bin/kosha list --installed
          bin/kosha doctor || true
          bin/kosha remove bhava vyom
      - name: Website is up to date
        run: python3 scripts/build-site.py --check
