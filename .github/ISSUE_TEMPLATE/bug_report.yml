name: Bug report
description: Something in kosha doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `kosha --version` and `kosha doctor`, your distribution.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output and log
      description: The command you ran, its output, and the end of `~/.local/state/kosha/history.log`.
      render: text
