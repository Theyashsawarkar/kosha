# kosha's registry: every package it knows. One table per package.
#
#   repo      GitHub "owner/name" (or a full git URL)
#   kind      where and how it installs:
#               vyom        ~/.local/share/vyom/core, bin/vyom linked
#               vyom-tool   ~/.local/share/vyom/plugins/<name>
#               app         ~/.local/share/<name>, bin/<name> linked
#               tmux-plugin ~/.tmux/plugins/<name> (TPM's folder), bin/<name> linked if it has one
#   requires  other kosha packages it needs (installed first)
#   commands  programs it needs on PATH (checked; kosha offers to install `arch` packages for missing ones)
#   arch      Arch packages that provide them
#   post      a command run in the package's folder after install and update
#   reload    a command run after install, update and remove (best effort)
#
# Adding a package: a pull request adding a table here. Version 1 of the format.
format = 1

[packages.vyom]
repo = "Theyashsawarkar/vyom"
kind = "vyom"
description = "Beautiful, keyboard-driven panels for Wayland: the runtime the Vyom tools run in"
commands = ["python3"]
arch = ["python-gobject", "python-cairo", "gtk4", "gtk4-layer-shell", "ttf-jetbrains-mono-nerd"]
reload = "vyom reload"

[packages.dvara]
repo = "Theyashsawarkar/dvara"
kind = "vyom-tool"
description = "App launcher: your most-used apps first, app actions, open windows"
requires = ["vyom"]

[packages.ganit]
repo = "Theyashsawarkar/ganit"
kind = "vyom-tool"
description = "Calculator and converter: answers as you type, units, currency"
requires = ["vyom"]
commands = ["qalc"]
arch = ["libqalculate"]

[packages.smriti]
repo = "Theyashsawarkar/smriti"
kind = "vyom-tool"
description = "Clipboard history: links, images and code told apart, pins"
requires = ["vyom"]
commands = ["cliphist", "wl-copy"]
arch = ["cliphist", "wl-clipboard"]

[packages.bhava]
repo = "Theyashsawarkar/bhava"
kind = "vyom-tool"
description = "Emoji picker: a grid, recents, skin tones; types it for you"
requires = ["vyom"]

[packages.tarang]
repo = "Theyashsawarkar/tarang"
kind = "vyom-tool"
description = "Wi-Fi with live signal, inline passwords, and the hotspot"
requires = ["vyom"]
commands = ["nmcli"]
arch = ["networkmanager"]

[packages.setu]
repo = "Theyashsawarkar/setu"
kind = "vyom-tool"
description = "Bluetooth: devices with battery, discovery, pairing"
requires = ["vyom"]
commands = ["bluetoothctl"]
arch = ["bluez-utils"]

[packages.doot]
repo = "Theyashsawarkar/doot"
kind = "vyom-tool"
description = "Your phone through KDE Connect: battery, send files, ring"
requires = ["vyom"]
commands = ["kdeconnect-cli"]
arch = ["kdeconnect"]

[packages.patra]
repo = "Theyashsawarkar/patra"
kind = "vyom-tool"
description = "Docker: containers by project, live CPU and memory, logs"
requires = ["vyom"]
commands = ["docker"]
arch = ["docker"]

[packages.suchana]
repo = "Theyashsawarkar/suchana"
kind = "vyom-tool"
description = "Notifications: on screen with actions, history, do not disturb"
requires = ["vyom"]

[packages.raga]
repo = "Theyashsawarkar/raga"
kind = "vyom-tool"
description = "YouTube music (into nada) and video (mpv)"
requires = ["vyom"]
commands = ["yt-dlp", "mpv"]
arch = ["yt-dlp", "mpv"]

[packages.mudra]
repo = "Theyashsawarkar/mudra"
kind = "vyom-tool"
description = "Keybinding search by what it does; Enter runs it"
requires = ["vyom"]

[packages.urja]
repo = "Theyashsawarkar/urja"
kind = "vyom-tool"
description = "Battery: charge, time left, health, power profile"
requires = ["vyom"]

[packages.vishram]
repo = "Theyashsawarkar/vishram"
kind = "vyom-tool"
description = "Power menu: one letter each, a countdown with cancel"
requires = ["vyom"]

[packages.kendra]
repo = "Theyashsawarkar/kendra"
kind = "vyom-tool"
description = "Quick settings: toggles, sliders, battery, lock, power"
requires = ["vyom"]

[packages.nada]
repo = "Theyashsawarkar/nada"
kind = "app"
description = "Music player for your files and YouTube: synced lyrics, autoplay, downloads, vim keys"
commands = ["mpd", "yt-dlp", "ffmpeg"]
arch = ["mpd", "yt-dlp", "ffmpeg", "python-mutagen", "python-gobject", "gtk4", "python-ytmusicapi"]
reload = "nada quit"

[packages.drishya]
repo = "Theyashsawarkar/drishya"
kind = "app"
description = "Video player for YouTube, your files and any stream (HLS, links, sign-in): resume, history, downloads, vim keys"
commands = ["mpv", "yt-dlp", "ffmpeg"]
arch = ["mpv", "yt-dlp", "ffmpeg", "python-gobject", "gtk4", "libsecret"]
reload = "drishya quit"
post = "mkdir -p ~/.local/share/applications && ln -sfn \"$PWD/data/dev.vayu.Drishya.desktop\" ~/.local/share/applications/"

[packages.anumati]
repo = "Theyashsawarkar/anumati"
kind = "app"
description = "Root commands for AI agents, run only after you approve them"
link = false
post = "./install.sh"

[packages.vesha]
repo = "Theyashsawarkar/vesha"
kind = "app"
description = "Every Claude Code account, one key away: switch from anywhere, auto-switch at the usage limit"
commands = ["claude"]
reload = "systemctl --user try-restart vesha.service"

[packages.kaushal]
repo = "Theyashsawarkar/kaushal"
kind = "app"
description = "Skills and tools for every AI agent (Claude Code, Codex, opencode, Gemini CLI), in every session"
commands = ["python3", "git"]
link = false
post = "./install.sh"
reload = "kaushal sync --quiet"

[packages.varna]
repo = "Theyashsawarkar/varna"
kind = "app"
description = "One theme for every tool: sway, waybar, tmux, kitty, Neovim, mako, Vyom and more, live"
post = "bin/varna ensure"

[packages.vinyasa]
repo = "Theyashsawarkar/vinyasa"
kind = "app"
description = "Vayu's settings app: themes for every tool, your own themes, fonts, wallpaper, windows"
requires = ["varna"]
arch = ["python-gobject", "gtk4"]
post = "mkdir -p ~/.local/share/applications && ln -sfn \"$PWD/data/dev.vayu.Vinyasa.desktop\" ~/.local/share/applications/"

[packages.sangam]
repo = "Theyashsawarkar/sangam"
kind = "tmux-plugin"
description = "Review and merge GitHub pull requests without leaving the terminal"
commands = ["gh", "fzf", "tmux"]
arch = ["github-cli", "fzf", "tmux"]

[packages.kosha]
repo = "Theyashsawarkar/kosha"
kind = "app"
description = "This package manager"

[packages.pattan]
repo = "Theyashsawarkar/pattan"
kind = "tmux-plugin"
description = "Your dev servers' ports, Docker's and their tunnels (ngrok, cloudflared...): Enter opens one in the browser"
commands = ["go", "tmux", "ss"]
arch = ["go", "tmux", "iproute2"]
post = "go build -trimpath -o bin/pattan ./cmd/pattan && mkdir -p ~/.local/bin && ln -sfn \"$PWD/bin/pattan\" ~/.local/bin/pattan"

[packages.nauka]
repo = "Theyashsawarkar/nauka"
kind = "tmux-plugin"
description = "Docker in the terminal: containers, compose, images, volumes, networks, and what's attached to what"
commands = ["go", "tmux", "docker"]
arch = ["go", "tmux", "docker", "docker-compose"]
post = "go build -trimpath -o bin/nauka ./cmd/nauka && mkdir -p ~/.local/bin && ln -sfn \"$PWD/bin/nauka\" ~/.local/bin/nauka"

[packages.sandesh]
repo = "Theyashsawarkar/sandesh"
kind = "tmux-plugin"
description = "Gmail and Google Chat in the terminal, with an MCP server for AI agents"
commands = ["go", "tmux"]
arch = ["go", "tmux"]
post = "go build -trimpath -o bin/sandesh ./cmd/sandesh && mkdir -p ~/.local/bin && ln -sfn \"$PWD/bin/sandesh\" ~/.local/bin/sandesh"

[packages.pramana]
repo = "Theyashsawarkar/pramana"
kind = "app"
description = "Your system's password prompts (polkit), in your desktop's look"
link = false
post = "./install.sh"

[packages.prasar]
repo = "Theyashsawarkar/prasar"
kind = "tmux-plugin"
description = "Write once, post to X and LinkedIn from the terminal: live previews, drafts, a schedule (free)"
commands = ["go", "tmux"]
arch = ["go", "tmux"]
post = "go build -trimpath -o bin/prasar ./cmd/prasar && mkdir -p ~/.local/bin && ln -sfn \"$PWD/bin/prasar\" ~/.local/bin/prasar"
